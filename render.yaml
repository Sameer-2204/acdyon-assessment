services:
  - type: web
    name: job-scraper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SCRAPE_INTERVAL
        value: "300"
      - key: SCRAPE_JITTER
        value: "60"
